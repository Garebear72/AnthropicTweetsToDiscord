name: Claude Reset Watch

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # needed to save state.json back to the repo

concurrency:
  group: reset-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check feeds and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python reset_watcher.py

      - name: Save state (remembers which posts were already seen)
        run: |
          git config user.name "reset-watch-bot"
          git config user.email "reset-watch-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update seen posts" && git push)
